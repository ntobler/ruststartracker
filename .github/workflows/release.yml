
name: Release CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: write

jobs:

  make-release:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies and create source distribution
      run: |
        pip install maturin
        maturin sdist

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload sdist
      run: |
        for file in ./target/wheels/*; do
          echo "Uploading $file..."
          gh release upload "${{ github.ref_name }}" "$file" --clobber
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-wheels:
    strategy:
      matrix:
        architecture: [arm64, x86-64]
        python-version: ['3.10', '3.11', '3.12']

    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

    needs:
        - make-release

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and build the wheel
      run: |
        pip install maturin
        maturin build --release

    - name: Upload wheel
      run: |
        for file in ./target/wheels/*; do
          echo "Uploading $file..."
          gh release upload "${{ github.ref_name }}" "$file" --clobber
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
