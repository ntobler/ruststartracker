
name: Test develop CI/CD Pipeline

on:
  push:
    branches:
      - "**"  # All branches
    tags-ignore:
      - "**"  # Ignore all tags

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev libopencv-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install poetry
        poetry install
      env:
        POETRY_VIRTUALENVS_CREATE: false

    - name: Pre-commit checks
      run: |
        PYTHONFAULTHANDLER=1 pre-commit run --all-files

    - name: Run pytest
      run: |
        pytest

    - name: Run mypy
      run: |
        mypy

    - name: Run cargo test
      uses: actions-rs/cargo@v1
      with:
        command: test
        args: --features=improc,gaia

    - name: Run example
      uses: actions-rs/cargo@v1
      with:
        command: run
        args: --example basic --features=gaia
