[package]
name = "ruststartracker"
version = "0.2.5"
description = "Lightweight Star Tracker"
authors = ["Nicolas Tobler <nitobler@gmail.com>"]
readme = "README.md"
edition = "2021"
license = "MIT"
repository = "https://github.com/ntobler/ruststartracker"
keywords = ["rust", "startracker", "star", "tracker", "astro"]
include = [
    "src/**",
    "examples/**",
    "ruststartracker/*.csv",
    "./Cargo.toml",
    "./README.md",
]

[lib]
name = "ruststartracker"
crate-type = ["cdylib", "rlib"]

[dependencies]
itertools = "0.13.0"
kdtree = "0.7.0"
maths-rs = "0.2.6"
nalgebra = "0.33.2"
polyfit-rs = "0.2.1"
pyo3 = { version = "0.21.0", features = ["extension-module"] }
numpy = "0.21.0"
opencv = { version = "0.94.4", optional = true }
chrono = "0.4.41"
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
rand = "0.9.1"
rand_distr = "0.5.1"

[features]
default = []
improc = ["opencv"]
gaia = []
hipparcos = []
