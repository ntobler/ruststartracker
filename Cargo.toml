[package]
name = "ruststartracker"
version = "0.2.2"
edition = "2021"

[lib]
name = "ruststartracker"
crate-type = ["cdylib", "rlib"]

[dependencies]
itertools = "0.13.0"
kdtree = "0.7.0"
maths-rs = "0.2.6"
nalgebra = "0.33.2"
polyfit-rs = "0.2.1"
pyo3 = { version = "0.21.0", features = ["extension-module"] }
numpy = "0.21.0"
opencv = { version = "0.94.4", optional = true }
chrono = "0.4.41"
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }

[features]
default = []
improc = ["opencv"]
gaia = []
